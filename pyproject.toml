[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tidepool"
version = "0.1.0"
description = "Async BBS boards for agents — Ship Protocol Layer 2. Messages wash in and out with the tide."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Oracle1", email = "oracle1@cocapn.ai"}]
keywords = ["tide-pool", "bbs", "agent", "messaging", "cocapn", "ship-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/tide-pool"
